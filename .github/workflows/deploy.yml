name: Deploy to Play Store

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Until release secrets exist, still analyze/test/build but skip
      # signing, the GitHub release and the Play upload instead of failing.
      - name: Check release secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          echo "signing=$([ -n "$KEYSTORE_BASE64" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "play=$([ -n "$PLAY_STORE_JSON_KEY" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          [ -n "$KEYSTORE_BASE64" ] || echo "::notice::KEYSTORE_BASE64 not set - building without release signing; release and upload skipped."
          [ -n "$PLAY_STORE_JSON_KEY" ] || echo "::notice::PLAY_STORE_JSON_KEY not set - Play upload skipped."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Decode keystore
        if: steps.secrets.outputs.signing == 'true'
        run: |
          mkdir -p android/properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/properties/upload.jks

      - name: Create key.properties
        if: steps.secrets.outputs.signing == 'true'
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../properties/upload.jks\n' \
            "${{ secrets.KEY_STORE_PASSWORD }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" \
            > android/properties/key.properties

      - name: Create env files
        run: |
          mkdir -p env
          printf '%s' "${{ secrets.ENV_PROD }}" > env/prod.env
          printf '%s' "${{ secrets.ENV_DEV }}" > env/dev.env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2)
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          flutter build apk \
            --release \
            --dart-define=ENV=prod \
            --build-number=${{ steps.version.outputs.build }}

      - name: Build App Bundle
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=ENV=prod \
            --build-number=${{ steps.version.outputs.build }}

      - name: Create GitHub Release
        if: steps.secrets.outputs.signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
          files: build/app/outputs/apk/release/app-release.apk

      - name: Upload to Play Store (Internal Testing)
        if: steps.secrets.outputs.signing == 'true' && steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.techorbit.tour_board
          releaseFiles: build/app/outputs/bundle/release/*.aab
          tracks: internal
          status: completed
